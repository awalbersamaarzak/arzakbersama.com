# Mengunduh foto situs dari sumbernya, mengecilkan ukurannya, membuang metadata (EXIF/GPS),
# lalu menyimpannya di folder foto/. Jalan otomatis saat file ini berubah, atau manual dari tab Actions.
name: Ambil foto situs

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['.github/workflows/foto.yml']

permissions:
  contents: write

jobs:
  foto:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install pillow==11.0.0
      - name: Unduh dan kecilkan foto
        run: |
          python - <<'PY'
          import io, pathlib, urllib.request
          from PIL import Image, ImageOps
          U = 'https://images.unsplash.com/'
          I = 'https://introdental.id/uploads/gallery/'
          # nama file, sumber, lebar maksimum (px)
          FOTO = [
              ('hero-jembatan-suroboyo',  U + 'photo-1727402528001-9d2ea45d0993?w=2400&q=90&fm=jpg', 2400),  # Rizki Oceano / Unsplash
              ('suramadu',                U + 'photo-1542218773294-ff28be7e6451?w=1600&q=90&fm=jpg', 1600),  # Ahmad Nabili / Unsplash
              ('properti',                U + 'photo-1615406020658-6c4b805f1f30?w=1800&q=90&fm=jpg', 1800),  # Amir Hosseini / Unsplash
              ('kreatif',                 U + 'photo-1769689268229-3e9c9ddaf1ee?w=1800&q=90&fm=jpg', 1800),  # Anna Spoljar / Unsplash
              ('intro-ruang-perawatan',   I + '1766033792_da64e3f6a7adcbc8fb90.jpeg', 1800),                 # Klinik Utama INTRO Dental
              ('intro-lobi',              I + '1766034173_cca6f408b66af8667fce.jpeg', 1800),                 # Klinik Utama INTRO Dental
              ('intro-radiologi',         I + '1766034279_b13e7bfc8f5c37d89872.jpeg', 1400),                 # Klinik Utama INTRO Dental
          ]
          out = pathlib.Path('foto'); out.mkdir(exist_ok=True)
          for nama, url, lebar in FOTO:
              req = urllib.request.Request(url, headers={'User-Agent': 'arzakbersama.com-site-build'})
              data = urllib.request.urlopen(req, timeout=90).read()
              im = ImageOps.exif_transpose(Image.open(io.BytesIO(data))).convert('RGB')
              if im.width > lebar:
                  im = im.resize((lebar, round(im.height * lebar / im.width)), Image.LANCZOS)
              # disimpan tanpa EXIF: lokasi GPS dan data kamera tidak ikut
              im.save(out / f'{nama}.jpg', 'JPEG', quality=80, optimize=True, progressive=True)
              print(f'{nama}: {im.size[0]}x{im.size[1]}, {(out / f"{nama}.jpg").stat().st_size // 1024} KB')
          PY
      - name: Simpan ke repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add foto
          git diff --cached --quiet || git commit -m "Foto situs (diunduh dan dikecilkan otomatis)"
          git push
